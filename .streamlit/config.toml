[server]
# Leaf photos are small; a low limit also protects the public app.
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
# Limestone, vine green, grape and Bordeaux-mixture blue; webapp/style.py uses the same tokens.
base = "light"
primaryColor = "#1D7F8E"
backgroundColor = "#EEF0EA"
secondaryBackgroundColor = "#E3E7DE"
textColor = "#16201B"
